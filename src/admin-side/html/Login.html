<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="/admin-side/css/AdminAuth.css">
</head>
<body>
    <div class="split-container">
        <div class="left-panel" style="background: linear-gradient(135deg, rgba(58, 168, 86, 0.85) 0%, rgba(80, 200, 120, 0.85) 100%), url('/images/bsu-bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">
            <h1>HEALTH SERVICES <br> ADMIN PORTAL</h1>
        </div>
        <div class="right-panel">
            <div class="logos-top-right">
                <img src="../images/health_service_logo.png" alt="Health Service Logo">
            </div>
            <div class="logos-top-left">
                <img src="../images/bsu_logo.png" alt="BSU Logo">
            </div>
            <div class="auth-form-container">
                <h2>Log in your Account</h2>
                <form id="adminLoginForm">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="loginUsername" placeholder="Enter your username" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <div class="password-wrapper">
                            <input type="password" id="loginPassword" placeholder="Enter password" required>
                            <span class="toggle-password" onclick="toggleVisibility('loginPassword', this)">👁</span>
                        </div>
                    </div>
                    <a href="/admin/forgot-password" class="forgot-link">Forgot Password?</a>
                    
                    <button type="submit" class="auth-btn">Sign In</button>
                </form>
                <div class="switch-page">
                    Don't have an account? <a href="javascript:void(0)" onclick="transitionTo('/admin/register')">Sign Up</a>
                </div>
            </div>
        </div>
    </div>
    <script src="/admin-side/js/AdminAuth.js"></script>
</body>
</html>
