<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="../css/NewSForm.css">
</head>
<body>
    <div class="main-container">
        <div class="registration-card">
            <button id="closeBtn" class="close-btn">&times;</button>
            <h1 class="form-title">Student Registration</h1>

            <form id="studentRegistrationForm">
                <div class="input-group">
                    <label for="srcode" >SR-Code:</label>
                    <input type="text" placeholder="SR-Code" id="srcode" required autocomplete="off">
                </div>

                <div class="input-group">
                    <label for="fullname">Fullname:</label>
                    <input type="text" placeholder="Fullname" id="fullname" required>
                </div>

                <div class="input-group">
                    <label for="department">Department:</label>
                    <select id="department" required>
                        <option value="">Select Department</option>
                        <option value="CICS">CICS</option>
                        <option value="CABEIHM">CABEIHM</option>
                        <option value="CET">CET</option>
                        <option value="CTE">CTE</option>
                        <option value="CAS">CAS</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="program">Program:</label>
                    <input type="text" placeholder="e.g. BS Information Technology" id="program" required>
                </div>

                <div class="input-group">
                    <label for="birthday">Birthday:</label>
                    <input type="date" id="birthday" required>
                </div>

                <div class="input-group">
                    <label for="gender">Gender:</label>
                    <select id="gender" required>
                        <option value="">Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <div id="successModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="icon-circle">
                <span class="check-mark">&#10003;</span>
            </div>
            <h2>Registered Successfully!</h2>
            <button id="doneBtn" class="done-btn">Done</button>
        </div>
    </div>

    <script src="../js/NewSForm.js"></script>
</body>
</html>
