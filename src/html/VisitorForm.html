<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitor Form</title>
    <link rel="stylesheet" href="../css/VisitorForm.css">
</head>
<body>
    <div class="main-container">
        <div class="visitor-card">
            <button id="closeBtn" class="close-btn">&times;</button>
            <h1 class="form-title">Visitor's Form</h1>

            <form id="visitorForm">
                <div class="top-section">
                    <div class="left-col">
                        <div class="input-group">
                            <label for="idNo">ID No.:</label>
                            <input type="text" id="idNo" required autocomplete="off">
                        </div>
                        <div class="input-group">
                            <label for="visitDate">DATE:</label>
                            <input type="date" id="visitDate" readonly class="readonly-field">
                        </div>
                        <div class="input-group">
                            <label for="timeIn">TIME IN:</label>
                            <input type="time" id="timeIn" readonly class="readonly-field">
                        </div>
                        <div class="input-group">
                            <label for="timeOut">TIME OUT:</label>
                            <input type="time" id="timeOut" readonly class="readonly-field">
                        </div>
                        <div class="input-group">
                            <label for="fullname">NAME:</label>
                            <input type="text" id="fullname" required>
                        </div>
                        <div class="input-group">
                            <label for="birthday">BIRTHDAY:</label>
                            <input type="date" id="birthday" required>
                        </div>
                        <div class="input-group">
                            <label for="age">AGE:</label>
                            <input type="number" id="age" readonly class="readonly-field">
                        </div>
                        <div class="input-group">
                            <label for="gender">GENDER:</label>
                            <select id="gender" required>
                                <option value="">Choose..</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="specialNeeds">SPECIAL<br>NEEDS:</label>
                            <select id="specialNeeds">
                                <option value="">Choose..</option>
                                <option value="None">None</option>
                                <option value="Pwd">Pwd</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        
                        <div class="input-group" id="otherNeedsGroup" style="display: none;">
                            <label for="specialNeedsOther">SPECIFY:</label>
                            <input type="text" id="specialNeedsOther" placeholder="Please specify">
                        </div>
                    </div>
                    
                    <div class="right-col">
                        <div class="purpose-group">
                            <label for="purposeSelect">PURPOSE<br>OF VISIT:</label>
                            <select id="purposeSelect" required>
                                <option value="">Choose purpose...</option>
                                <option value="Medical Certificate">Medical Certificate</option>
                                <option value="Medical Consult">Medical Consult</option>
                                <option value="Dental">Dental</option>
                                <option value="Blood Pressure">Blood Pressure</option>
                                <option value="Others">Others</option>
                            </select>
                        </div>

                        <div id="certTypeGroup" style="display: none; margin-top: 15px; width: 100%; text-align: left;">
                            <label class="purpose-header" style="font-size: 16px; display: block; margin-bottom: 10px; color: black;">CERTIFICATE TYPE:</label>
                            <div class="radio-sub-list">
                                <label><input type="radio" name="cert_type" value="Tour" /> Tour/ Local Off-Campus</label>
                                <label><input type="radio" name="cert_type" value="OJT" /> OJT/ Pre-Employment</label>
                                <label><input type="radio" name="cert_type" value="Athletic" /> Pre-Athletic</label>
                                <label><input type="radio" name="cert_type" value="Enrolment" /> Pre-Enrolment</label>
                            </div>
                        </div>

                        <div id="othersSpecifyGroup" style="display: none; margin-top: 15px; width: 100%;">
                            <label class="purpose-header" style="font-size: 16px; display: block; margin-bottom: 10px; text-align: left; color: black;">SPECIFY OTHER:</label>
                            <input type="text" id="others_specify" placeholder="Please specify..." class="specify-box" style="width: 100%; padding: 10px 14px; border: none; border-radius: 8px; background-color: #f1f3f5; box-sizing: border-box;" />
                        </div>
                    </div>
                </div>

                <div class="signature-section">
                    <canvas id="signatureCanvas" width="380" height="120"></canvas>
                    <p>Please place your electronic signature above.</p>
                    <button type="button" id="clearSignatureBtn" class="clear-btn">Clear Signature</button>
                    <input type="hidden" id="signatureData" name="signatureData">
                </div>

                <div class="btn-container">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../js/VisitorForm.js"></script>
</body>
</html>
