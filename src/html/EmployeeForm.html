<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Medical Form</title>
    <link rel="stylesheet" href="../css/EmployeeForm.css" />
</head>
<body>
    <div class="main-container">
        <div class="emerald-card">
            <button id="closeBtn" class="close-btn" type="button">X</button>
            <h1 class="form-title">Employee Form</h1>

            <form class="employee-form-grid" id="employeeForm">
                <div class="form-column">
                    <div class="input-group">
                        <label for="employeeId">Employee ID:</label>
                        <input type="text" id="employeeId" placeholder="ID Number" autocomplete="off" />
                    </div>

                    <div class="input-group">
                        <label for="visitDate">DATE:</label>
                        <input type="date" id="visitDate" readonly onfocus="this.blur()" />
                    </div>

                    <div class="input-group">
                        <label for="timeIn">TIME IN:</label>
                        <input type="time" id="timeIn" readonly onfocus="this.blur()" />
                    </div>

                    <div class="input-group">
                        <label for="timeOut">TIME OUT:</label>
                        <input type="time" id="timeOut" autocomplete="off" readonly onfocus="this.blur()" />
                    </div>

                    <div class="input-group">
                        <label for="name">NAME:</label>
                        <input type="text" id="name" placeholder="Name" readonly class="readonly-field" />
                    </div>

                    <div class="input-group">
                        <label for="department">DEPARTMENT:</label>
                        <input type="text" id="department" placeholder="Department" readonly class="readonly-field" />
                    </div>

                    <div class="input-group">
                        <label for="position">POSITION:</label>
                        <input type="text" id="position" placeholder="Position" readonly class="readonly-field" />
                    </div>

                    <div class="input-group">
                        <label for="employmentType">EMPLOYMENT TYPE:</label>
                        <input type="text" id="employmentType" placeholder="Employment Type" readonly class="readonly-field" />
                    </div>

                    <div class="input-group">
                        <label for="employmentStatus">EMPLOYMENT STATUS:</label>
                        <input type="text" id="employmentStatus" placeholder="Employment Status" readonly class="readonly-field" />
                    </div>

                    <div class="input-group">
                        <label for="birthday">BIRTHDAY:</label>
                        <input type="date" id="birthday" />
                    </div>

                    <div class="input-group">
                        <label for="age">AGE:</label>
                        <input type="text" id="age" placeholder="Age" readonly />
                    </div>

                    <div class="input-group">
                        <label for="gender">GENDER:</label>
                        <select id="gender" name="Gender">
                            <option value="">Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                            <option value="Prefer not to say">Prefer not to say</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="specialNeeds">SPECIAL NEEDS:</label>
                        <select id="specialNeeds">
                            <option value="">Choose..</option>
                            <option value="None">None</option>
                            <option value="Pwd">Pwd</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group" id="otherNeedsGroup" style="display: none;">
                        <label for="specialNeedsOther">SPECIFY:</label>
                        <input type="text" id="specialNeedsOther" placeholder="Please specify" />
                    </div>
                </div>

                <div class="form-column right-column">
                    <h3 class="purpose-header">PURPOSE OF VISIT:</h3>

                    <div class="input-group">
                        <label for="purposeSelect">SELECT PURPOSE:</label>
                        <select id="purposeSelect">
                            <option value="">Choose purpose...</option>
                            <option value="Medical Consult">Medical Consult/Medicine</option>
                            <option value="Dental">Dental</option>
                            <option value="Medical Certificate">Medical Certificate</option>
                            <option value="Blood Pressure">Blood Pressure</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>

                    <div id="certTypeGroup" style="display: none; margin-top: 15px;">
                        <label class="purpose-header" style="font-size: 16px; display: block; margin-bottom: 10px;">CERTIFICATE TYPE:</label>
                        <div class="radio-sub-list">
                            <label><input type="radio" name="cert_type" value="Tour" /> Tour/ Local Off-Campus</label>
                            <label><input type="radio" name="cert_type" value="OJT" /> OJT/ Pre-Employment</label>
                            <label><input type="radio" name="cert_type" value="Athletic" /> Pre-Athletic</label>
                            <label><input type="radio" name="cert_type" value="Enrolment" /> Pre-Enrolment</label>
                        </div>
                    </div>

                    <div id="othersSpecifyGroup" style="display: none; margin-top: 15px;">
                        <label class="purpose-header" style="font-size: 16px; display: block; margin-bottom: 10px;">SPECIFY OTHER:</label>
                        <input type="text" id="others_specify" placeholder="Please specify..." class="specify-box" />
                    </div>
                </div>

                <div class="signature-section">
                    <canvas id="signatureCanvas" width="380" height="120"></canvas>
                    <p>Please place your electronic signature above.</p>
                    <button type="button" id="clearSignatureBtn" class="clear-btn">Clear Signature</button>
                    <input type="hidden" id="signatureData" name="signatureData">
                </div>

                <button type="submit" class="submit-btn">Submit</button>
            </form>
        </div>
    </div>

    <script src="../js/EmployeeForm.js"></script>
</body>
</html>
